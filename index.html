<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:,">
    <title>Suivi INV by Princi</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            padding: 16px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: stretch;
        }

        .top-bar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: flex-start;
            gap: 28px;
            margin-bottom: 14px;
        }

        .page-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 0;
        }

        .tab-btn {
            padding: 10px 20px;
            border: none;
            border-radius: 10px;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            background-color: #ffffff;
            color: #5f6368;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
            transition: all 0.2s ease;
        }

        .tab-btn:hover {
            background-color: #e8f0fe;
            color: #1a73e8;
        }

        .tab-btn.active {
            background-color: #1a73e8;
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(26, 115, 232, 0.3);
        }
        .main-dashboard {
            display: flex;
            flex-direction: row;
            gap: 20px;
            width: 100%;
            min-height: calc(100vh - 82px);
        }

        .left-panel {
            flex: 1.15;
            background: #ffffff;
            padding: 20px 24px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            text-align: center;
        }

        .right-panel {
            flex: 1;
            background: #ffffff;
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
            display: flex;
            flex-direction: column;
        }

        h2 {
            color: #202124;
            margin: 0 0 12px 0;
            font-size: 1.5rem;
        }

        .filters-wrapper {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
            margin-bottom: 0;
            width: auto;
        }

        .filter-box {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #f8f9fa;
            padding: 8px 14px;
            border-radius: 10px;
            border: 1px solid #e0e0e0;
        }

        .filter-box label {
            font-weight: 600;
            color: #444;
            font-size: 0.95rem;
        }

        .filter-box input[type="date"],
        .filter-box select {
            padding: 6px 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-family: inherit;
            font-size: 0.95rem;
            color: #333;
            background-color: #fff;
            cursor: pointer;
        }
        .speedometer-wrapper {
            position: relative;
            background: radial-gradient(circle at 50% 55%, #262a33 0%, #121418 100%);
            padding: 16px;
            border-radius: 16px;
            width: 100%;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-shadow: inset 0 0 24px rgba(0, 0, 0, 0.85), 0 6px 16px rgba(0, 0, 0, 0.15);
            border: 3px solid #3c4043;
        }

        .famille-badge {
            position: absolute;
            top: 16px;
            background: #111317;
            border: 1.5px solid #3c4043;
            border-radius: 10px;
            padding: 8px 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 105px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.45);
            z-index: 2;
        }

        .tissu-badge {
            left: 16px;
            border-top: 3px solid #ff5252;
        }

        .semaine-badge {
            left: 50%;
            transform: translateX(-50%);
            border-top: 3px solid #1a73e8;
        }

        .accessoire-badge {
            right: 16px;
            border-top: 3px solid #1ae82b;
        }

        .famille-title {
            font-size: 0.72rem;
            font-weight: 700;
            color: #f8fbff;
            letter-spacing: 1px;
            margin-bottom: 2px;
        }

        .famille-count {
            font-family: 'Courier New', monospace;
            font-size: 1.45rem;
            font-weight: bold;
        }

        .tissu-badge .famille-count {
            color: #ff5252;
        }

        .semaine-badge .famille-count {
            color: #4dabf7;
        }

        .accessoire-badge .famille-count {
            color: #5bf347;
        }
        .speedo-svg {
            width: 100%;
            max-width: 450px;
            height: auto;
            display: block;
            margin: 18px auto 0 auto;
            overflow: visible;
        }

        .needle {
            transform-origin: 170px 165px;
            transform: rotate(-120deg);
            transition: transform 1.2s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .counter-label {
            font-size: 1.05rem;
            color: #e8eaed;
            font-weight: 600;
            margin-top: 8px;
            letter-spacing: 0.4px;
        }

        .actions-wrapper {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            width: 100%;
        }

        .btn {
            color: white;
            border: none;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
            text-align: center;
        }

        .btn:hover { opacity: 0.9; }
        .btn:active { transform: scale(0.98); }

        .btn-details { background-color: #f57c00; letter-spacing: 0.5px; }
        .btn-refresh { background-color: #1a73e8; }
        .btn-excel { background-color: #1e8e3e; }
        .btn-print { background-color: #5f6368; }

        .logo-placeholder {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 24px;
            margin-top: 20px;
        }

        .logo-placeholder img {
            max-width: 75%;
            max-height: 300px;
            width: auto;
            height: auto;
            object-fit: contain;
            opacity: 0.95;
        }
        .table-container {
            margin-top: 20px;
            flex: 1;
            max-height: calc(100vh - 180px);
            overflow-y: auto;
            border: 1px solid #e0e0e0;
            border-radius: 10px;
            text-align: left;
            display: none;
        }

        table { width: 100%; border-collapse: collapse; font-size: 0.92rem; }
        th {
            background-color: #f1f3f4;
            color: #3c4043;
            font-weight: 600;
            padding: 12px;
            position: sticky;
            top: 0;
            border-bottom: 1px solid #ddd;
            z-index: 1;
        }
        td { padding: 10px 12px; border-bottom: 1px solid #eee; color: #333; }
        tr:last-child td { border-bottom: none; }
        tr:hover { background-color: #f8f9fa; }

        .agent-badge {
            display: inline-block;
            background: #e8f0fe;
            color: #1967d2;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: 500;
            margin-right: 4px;
        }

        .status { font-size: 0.85rem; color: #777; margin-top: 10px; }

        @media (max-width: 900px) {
            .main-dashboard { flex-direction: column; }
            .actions-wrapper { grid-template-columns: 1fr; }
        }

        @media (max-width: 520px) {
            .famille-badge { padding: 5px 8px; min-width: 78px; top: 10px; }
            .tissu-badge { left: 8px; }
            .accessoire-badge { right: 8px; }
            .famille-title { font-size: 0.62rem; }
            .famille-count { font-size: 1.1rem; }
        }

        @media print {
            body { background-color: #fff; padding: 0; display: block; }
            .main-dashboard { display: block; }
            .left-panel, .right-panel { box-shadow: none; padding: 0; }
            .no-print, .logo-placeholder, .top-bar { display: none !important; }
            .speedometer-wrapper {
                background: #1e2229 !important;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
            .table-container { max-height: none; overflow: visible; border: 1px solid #999; }
        }
    </style>
</head>
<body>
    <div class="top-bar no-print">
        <div class="page-tabs">
            <button class="tab-btn active" id="tabPage1" onclick="changerPage(1)">PAR DATE DE SAISIE</button>
            <button class="tab-btn" id="tabPage2" onclick="changerPage(2)">DATE RÉEL (DATE EO @FICHE)</button>
        </div>

        <div class="filters-wrapper">
            <div class="filter-box">
                <label for="dateFilter">DATE :</label>
                <input type="date" id="dateFilter" onchange="onDateChange()">
            </div>
            <div class="filter-box">
                <label for="agentFilter">AGENT :</label>
                <select id="agentFilter" onchange="appliquerFiltres()">
                    <option value="ALL">TOUS</option>
                </select>
            </div>
        </div>
    </div>

    <div class="main-dashboard">
        <div class="left-panel">
            <h2 id="mainTitle">SUIVI INVENTAIRE PAR DATE DE SAISIE</h2>

            <div class="speedometer-wrapper">
                <div class="famille-badge tissu-badge">
                    <span class="famille-title">TISSU</span>
                    <span class="famille-count" id="tissuCount">0</span>
                </div>

                <div class="famille-badge semaine-badge">
                    <span class="famille-title">SEMAINE</span>
                    <span class="famille-count" id="semaineCount">0</span>
                </div>

                <div class="famille-badge accessoire-badge">
                    <span class="famille-title">ACCESSOIRE</span>
                    <span class="famille-count" id="accessoireCount">0</span>
                </div>

                <svg class="speedo-svg" viewBox="0 0 340 250">
                    <defs>
                        <linearGradient id="speedArcGrad" x1="0%" y1="100%" x2="100%" y2="0%">
                            <stop offset="0%" stop-color="#ff3d00" />
                            <stop offset="45%" stop-color="#ffea00" />
                            <stop offset="100%" stop-color="#00e676" />
                        </linearGradient>
                    </defs>

                    <path d="M 50.5 234 A 138 138 0 1 1 289.5 234" fill="none" stroke="url(#speedArcGrad)" stroke-width="10" stroke-linecap="round" />

                    <g id="speedoTicks"></g>

                    <text x="170" y="102" text-anchor="middle" fill="#9aa0a6" font-size="8.5" font-weight="bold" letter-spacing="1.2">RÉFÉRENCES</text>
                    <rect x="132" y="108" width="76" height="34" rx="6" fill="#0d0f12" stroke="#3c4043" stroke-width="1.5" />
                    <text id="uniqueCount" x="170" y="132" text-anchor="middle" fill="#00e676" font-family="'Courier New', monospace" font-size="22" font-weight="bold">0</text>

                    <g id="needleGroup" class="needle">
                        <polygon points="166,165 174,165 170,42" fill="#ff3d00" />
                        <circle cx="170" cy="165" r="14" fill="#202124" stroke="#757575" stroke-width="2.5" />
                        <circle cx="170" cy="165" r="5" fill="#ff3d00" />
                    </g>
                </svg>

                <div class="counter-label" id="counterLabel">Référence Unique</div>
            </div>

            <div class="status no-print" id="statusMsg">ACTUALISATION ENCOURS...</div>
        </div>
        <div class="right-panel">
            <div class="actions-wrapper no-print">
                <button class="btn btn-details" id="btnToggleDetails" onclick="toggleDetails()">DETAILS</button>
                <button class="btn btn-refresh" onclick="chargerDonnees()">ACTUALISER</button>
                <button class="btn btn-excel" onclick="exporterExcel()">DETAILS/EVALUATION (Excel)</button>
                <button class="btn btn-print" onclick="window.print()">IMPRIMER</button>
            </div>

            <div class="logo-placeholder" id="logoPlaceholder">
                <img src="13501.png" alt="Logo 13501" onerror="this.style.display='none'">
            </div>

            <div class="table-container" id="tableContainer">
                <table>
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Référence</th>
                            <th>Famille</th>
                            <th>Agent</th>
                        </tr>
                    </thead>
                    <tbody id="refTableBody"></tbody>
                </table>
            </div>
        </div>
    </div>
    <script>
        const SHEET_ID = "19C4-g_MffI9NRb8hpYusR5vOeglJLsWssuc9ZB4KzBI";
        const SHEET_NAME = "SAISIE_INVENTAIRE";
        const MAX_SPEEDO = 200;

        let currentPage = 1;
        let allRowsData = [];
        let currentFilteredList = [];
        let isDetailsVisible = false;

        function changerPage(pageNum) {
            if (currentPage === pageNum) return;
            currentPage = pageNum;

            document.getElementById("tabPage1").classList.toggle("active", pageNum === 1);
            document.getElementById("tabPage2").classList.toggle("active", pageNum === 2);

            const titleEl = document.getElementById("mainTitle");
            if (titleEl) {
                titleEl.textContent = pageNum === 1 ? "SUIVI INVENTAIRE PAR DATE DE SAISIE" : "SUIVI INVENTAIRE PAR DATE RÉEL (DATE EO @FICHE)";
            }

            isDetailsVisible = false;
            const tableContainer = document.getElementById("tableContainer");
            const logoPlaceholder = document.getElementById("logoPlaceholder");
            const btnDetails = document.getElementById("btnToggleDetails");
            if (tableContainer) tableContainer.style.display = "none";
            if (logoPlaceholder) logoPlaceholder.style.display = "flex";
            if (btnDetails) btnDetails.textContent = "DETAILS";

            mettreAJourListeAgents("ALL");
            appliquerFiltres();
        }

        function estLigneValidePourPage(row) {
            const agentCell = row.c.at(1);
            const typeColBCell = row.c.at(6);

            const rawAgent = (agentCell && agentCell.v) ? String(agentCell.v).trim().toUpperCase() : "";
            const typeColB = (typeColBCell && typeColBCell.v) ? String(typeColBCell.v).trim().toUpperCase() : "";

            if (rawAgent === "ORLI" || typeColB === "ORLI") return false;
            if (typeColB !== "INV") return false;

            return true;
        }

        function getActiveDateCell(row) {
            return currentPage === 1 ? row.c.at(2) : row.c.at(5);
        }

        function dessinerGraduationsCompteur() {
            const ticksGroup = document.getElementById("speedoTicks");
            if (!ticksGroup) return;

            const cx = 170;
            const cy = 165;
            const rOuter = 124;
            const rInnerMajor = 110;
            const rInnerMinor = 117;
            const rText = 95;

            let svgHtml = "";

            for (let val = 0; val <= MAX_SPEEDO; val += 10) {
                const isMajor = (val % 20 === 0);
                const angleDeg = -120 + (val / MAX_SPEEDO) * 240;
                const angleRad = (angleDeg - 90) * (Math.PI / 180);

                const x1 = cx + rOuter * Math.cos(angleRad);
                const y1 = cy + rOuter * Math.sin(angleRad);
                const rIn = isMajor ? rInnerMajor : rInnerMinor;
                const x2 = cx + rIn * Math.cos(angleRad);
                const y2 = cy + rIn * Math.sin(angleRad);

                let strokeColor = isMajor ? "#ffffff" : "#9aa0a6";
                if (val <= 40) strokeColor = "#ff5252";
                else if (val >= 160) strokeColor = "#00e676";

                const strokeWidth = isMajor ? "2.6" : "1.4";
                svgHtml += `<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="${strokeColor}" stroke-width="${strokeWidth}" stroke-linecap="round" />`;

                if (isMajor) {
                    const tx = cx + rText * Math.cos(angleRad);
                    const ty = cy + rText * Math.sin(angleRad) + 4;

                    let textColor = "#e8eaed";
                    if (val <= 40) textColor = "#ff5252";
                    else if (val >= 160) textColor = "#00e676";

                    svgHtml += `<text x="${tx.toFixed(1)}" y="${ty.toFixed(1)}" text-anchor="middle" fill="${textColor}" font-size="11.5" font-weight="bold">${val}</text>`;
                }
            }

            ticksGroup.innerHTML = svgHtml;
        }
        function mettreAJourAiguille(count) {
            const needle = document.getElementById("needleGroup");
            if (!needle) return;

            const clampedValue = Math.min(Math.max(count, 0), MAX_SPEEDO);
            const angle = -120 + (clampedValue / MAX_SPEEDO) * 240;
            needle.style.transform = `rotate(${angle}deg)`;
        }

        function toggleDetails() {
            const tableContainer = document.getElementById("tableContainer");
            const logoPlaceholder = document.getElementById("logoPlaceholder");
            const btnDetails = document.getElementById("btnToggleDetails");

            if (currentFilteredList.length === 0) {
                alert("Tsy misy angona haseho.");
                return;
            }

            isDetailsVisible = !isDetailsVisible;

            if (isDetailsVisible) {
                tableContainer.style.display = "block";
                if (logoPlaceholder) logoPlaceholder.style.display = "none";
                btnDetails.textContent = "MOINS";
            } else {
                tableContainer.style.display = "none";
                if (logoPlaceholder) logoPlaceholder.style.display = "flex";
                btnDetails.textContent = "DETAILS";
            }
        }

        function initDateInput() {
            const now = new Date();
            const yyyy = now.getFullYear();
            const mm = String(now.getMonth() + 1).padStart(2, '0');
            const dd = String(now.getDate()).padStart(2, '0');
            document.getElementById("dateFilter").value = `${yyyy}-${mm}-${dd}`;
        }

        function formatInputDateToSheetFormat(isoDate) {
            if (!isoDate) return "";
            const parts = isoDate.split("-");
            if (parts.length !== 3) return "";
            return parts.at(2) + "/" + parts.at(1) + "/" + parts.at(0);
        }

        function extractDateOnly(dateCell) {
            if (!dateCell) return "";
            const rawDateStr = dateCell.f ? String(dateCell.f) : String(dateCell.v);
            if (!rawDateStr) return "";

            if (rawDateStr.startsWith("Date(")) {
                const parts = rawDateStr.replace("Date(", "").replace(")", "").split(",");
                const annee = parts.at(0);
                const mois = String(parseInt(parts.at(1)) + 1).padStart(2, '0');
                const jour = String(parts.at(2)).padStart(2, '0');
                return `${jour}/${mois}/${annee}`;
            }

            return rawDateStr.trim().substring(0, 10);
        }

        function getBornesSemaine(isoDate) {
            if (!isoDate) return null;
            const parts = isoDate.split("-");
            if (parts.length !== 3) return null;

            const d = new Date(parseInt(parts.at(0), 10), parseInt(parts.at(1), 10) - 1, parseInt(parts.at(2), 10));
            const day = d.getDay();
            const diffToMonday = (day === 0) ? -6 : (1 - day);

            const lundi = new Date(d);
            lundi.setDate(d.getDate() + diffToMonday);
            lundi.setHours(0, 0, 0, 0);

            const dimanche = new Date(lundi);
            dimanche.setDate(lundi.getDate() + 6);
            dimanche.setHours(23, 59, 59, 999);

            return { lundi, dimanche };
        }

        function parseSheetDateToObj(dateStr) {
            if (!dateStr) return null;
            const parts = dateStr.split("/");
            if (parts.length !== 3) return null;
            const dd = parseInt(parts.at(0), 10);
            const mm = parseInt(parts.at(1), 10) - 1;
            const yyyy = parseInt(parts.at(2), 10);
            if (isNaN(dd) || isNaN(mm) || isNaN(yyyy)) return null;
            return new Date(yyyy, mm, dd, 12, 0, 0);
        }

        function construireFirstDateParRef() {
            const firstDateMap = {};
            allRowsData.forEach(row => {
                if (!estLigneValidePourPage(row)) return;

                const refCell = row.c.at(0);
                const dateCell = getActiveDateCell(row);

                if (refCell && refCell.v && dateCell) {
                    const refVal = String(refCell.v).trim().toUpperCase();
                    const dateOnly = extractDateOnly(dateCell);
                    const dateObj = parseSheetDateToObj(dateOnly);

                    if (refVal !== "" && dateObj) {
                        if (!firstDateMap[refVal] || dateObj.getTime() < firstDateMap[refVal].time) {
                            firstDateMap[refVal] = {
                                dateStr: dateOnly,
                                time: dateObj.getTime()
                            };
                        }
                    }
                }
            });
            return firstDateMap;
        }
        function canonicaliserBinome(rawAgent) {
            const clean = rawAgent.trim();
            if (!clean) return "Tsy voalaza";
            if (!clean.includes("/")) return clean;

            const membres = clean.split("/")
                .map(m => m.trim())
                .filter(m => m !== "");

            membres.sort((a, b) => a.localeCompare(b, 'fr', { sensitivity: 'base' }));
            return membres.join("/");
        }

        function construireMappingBinomesSemaine(bornes) {
            const binomeLookup = {};
            allRowsData.forEach(row => {
                if (!estLigneValidePourPage(row)) return;

                const refCell = row.c.at(0);
                const agentCell = row.c.at(1);
                const dateCell = getActiveDateCell(row);

                if (refCell && refCell.v && dateCell) {
                    const dateOnlyStr = extractDateOnly(dateCell);
                    const dateObj = parseSheetDateToObj(dateOnlyStr);
                    if (dateObj && dateObj >= bornes.lundi && dateObj <= bornes.dimanche) {
                        const rawAgent = (agentCell && agentCell.v) ? String(agentCell.v).trim() : "";
                        if (rawAgent !== "" && rawAgent.includes("/")) {
                            const canonique = canonicaliserBinome(rawAgent);
                            const membres = canonique.split("/");
                            membres.forEach(membre => {
                                const key = membre.toUpperCase();
                                if (!binomeLookup[key]) {
                                    binomeLookup[key] = canonique;
                                }
                            });
                        }
                    }
                }
            });
            return binomeLookup;
        }

        function construireMappingBinomes(targetDateStr) {
            const binomeLookup = {};
            allRowsData.forEach(row => {
                if (!estLigneValidePourPage(row)) return;

                const refCell = row.c.at(0);
                const agentCell = row.c.at(1);
                const dateCell = getActiveDateCell(row);

                if (refCell && refCell.v && dateCell) {
                    const dateOnly = extractDateOnly(dateCell);
                    if (dateOnly === targetDateStr) {
                        const rawAgent = (agentCell && agentCell.v) ? String(agentCell.v).trim() : "";
                        if (rawAgent !== "" && rawAgent.includes("/")) {
                            const canonique = canonicaliserBinome(rawAgent);
                            const membres = canonique.split("/");
                            membres.forEach(membre => {
                                const key = membre.toUpperCase();
                                if (!binomeLookup[key]) {
                                    binomeLookup[key] = canonique;
                                }
                            });
                        }
                    }
                }
            });
            return binomeLookup;
        }

        function normaliserAgent(rawAgent, binomeLookup) {
            const clean = rawAgent.trim();
            if (!clean) return "Tsy voalaza";
            if (clean.includes("/")) return canonicaliserBinome(clean);
            const key = clean.toUpperCase();
            return binomeLookup[key] ? binomeLookup[key] : clean;
        }

        function calculerTotalSemaine(selectedIsoDate, selectedAgent, firstDateMap) {
            const semaineEl = document.getElementById("semaineCount");
            if (!semaineEl) return;

            const bornes = getBornesSemaine(selectedIsoDate);
            if (!bornes) {
                semaineEl.textContent = "0";
                return;
            }

            const binomeLookupSemaine = construireMappingBinomesSemaine(bornes);
            const refsSemaineSet = new Set();

            allRowsData.forEach(row => {
                if (!estLigneValidePourPage(row)) return;

                const refCell = row.c.at(0);
                const agentCell = row.c.at(1);
                const dateCell = getActiveDateCell(row);

                if (refCell && refCell.v && dateCell) {
                    const refVal = String(refCell.v).trim().toUpperCase();
                    const dateOnlyStr = extractDateOnly(dateCell);
                    const dateObj = parseSheetDateToObj(dateOnlyStr);

                    if (dateObj && dateObj >= bornes.lundi && dateObj <= bornes.dimanche && refVal !== "") {
                        if (!firstDateMap[refVal] || firstDateMap[refVal].dateStr !== dateOnlyStr) return;

                        const rawAgent = (agentCell && agentCell.v) ? String(agentCell.v).trim() : "Tsy voalaza";
                        const finalAgent = normaliserAgent(rawAgent, binomeLookupSemaine);

                        const matchAgent = (selectedAgent === "ALL" || finalAgent === selectedAgent);

                }
            });

        function chargerDonnees() {
            const statusEl = document.getElementById("statusMsg");
            statusEl.textContent = "ACTUALISATION ENCOURS...";

            const oldScript = document.getElementById("googleSheetsJsonp");
            if (oldScript) oldScript.remove();

            const query = encodeURIComponent("SELECT C, K, P, L, G, A, B WHERE C IS NOT NULL AND (P IS NOT NULL OR A IS NOT NULL)");
            const host = "docs." + "google.com";
            const url = `https://${host}/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=responseHandler:traiterReponseSheets&sheet=${encodeURIComponent(SHEET_NAME)}&tq=${query}`;

            const script = document.createElement("script");
            script.id = "googleSheetsJsonp";
            script.src = url;
            script.onerror = function () {
                document.getElementById("uniqueCount").textContent = "!";
                statusEl.textContent = "ERREUR DE CHARGEMENT.";
            };
            document.body.appendChild(script);
        }
        function traiterReponseSheets(data) {
            const statusEl = document.getElementById("statusMsg");
            try {
                allRowsData = data.table.rows || [];

                const previousAgent = document.getElementById("agentFilter").value;
                mettreAJourListeAgents(previousAgent);
                appliquerFiltres();

                const nowTime = new Date().toLocaleTimeString('fr-FR');
                statusEl.textContent = "DERNIERE ACTUALISATION : " + nowTime;
            } catch (error) {
                console.error(error);
                document.getElementById("uniqueCount").textContent = "!";
                statusEl.textContent = "ERREUR DE TRAITEMENT.";
            }
        }

        function onDateChange() {
            mettreAJourListeAgents("ALL");
            appliquerFiltres();
        }

        function mettreAJourListeAgents(selectedToKeep) {
            const agentSelect = document.getElementById("agentFilter");
            const selectedIsoDate = document.getElementById("dateFilter").value;
            const targetDateStr = formatInputDateToSheetFormat(selectedIsoDate);
            const binomeLookup = construireMappingBinomes(targetDateStr);
            const firstDateMap = construireFirstDateParRef();

            const agentsSet = new Set();

            allRowsData.forEach(row => {
                if (!estLigneValidePourPage(row)) return;

                const refCell = row.c.at(0);
                const agentCell = row.c.at(1);
                const dateCell = getActiveDateCell(row);

                if (refCell && refCell.v && dateCell) {
                    const refVal = String(refCell.v).trim().toUpperCase();
                    const dateOnly = extractDateOnly(dateCell);
                    if (dateOnly === targetDateStr && refVal !== "") {
                        if (!firstDateMap[refVal] || firstDateMap[refVal].dateStr !== targetDateStr) return;

                        const rawAgent = (agentCell && agentCell.v) ? String(agentCell.v).trim() : "Tsy voalaza";
                        const finalAgent = normaliserAgent(rawAgent, binomeLookup);
                        agentsSet.add(finalAgent);
                    }
                }
            });

            agentSelect.innerHTML = `<option value="ALL">TOUS</option>`;
            Array.from(agentsSet).sort().forEach(agent => {
                const opt = document.createElement("option");
                opt.value = agent;
                opt.textContent = agent;
                agentSelect.appendChild(opt);
            });

            if (selectedToKeep && Array.from(agentsSet).includes(selectedToKeep)) {
                agentSelect.value = selectedToKeep;
            } else {
                agentSelect.value = "ALL";
            }
        }

        function appliquerFiltres() {
            const countEl = document.getElementById("uniqueCount");
            const tissuEl = document.getElementById("tissuCount");
            const accessoireEl = document.getElementById("accessoireCount");
            const labelEl = document.getElementById("counterLabel");
            const tableContainer = document.getElementById("tableContainer");
            const tbody = document.getElementById("refTableBody");
            const btnDetails = document.getElementById("btnToggleDetails");

            const selectedIsoDate = document.getElementById("dateFilter").value;
            const targetDateStr = formatInputDateToSheetFormat(selectedIsoDate);
            const selectedAgent = document.getElementById("agentFilter").value;

            if (!targetDateStr) return;

            const binomeLookup = construireMappingBinomes(targetDateStr);
            const firstDateMap = construireFirstDateParRef();
            const refMap = {};

            allRowsData.forEach(row => {
                if (!estLigneValidePourPage(row)) return;

                const refCell = row.c.at(0);
                const agentCell = row.c.at(1);
                const dateCell = getActiveDateCell(row);
                const familleCell = row.c.at(3);

                if (refCell && refCell.v && dateCell) {
                    const refVal = String(refCell.v).trim().toUpperCase();
                    const rawAgent = (agentCell && agentCell.v) ? String(agentCell.v).trim() : "Tsy voalaza";
                    const rawFamille = (familleCell && familleCell.v) ? String(familleCell.v).trim().toUpperCase() : "";
                    const dateOnly = extractDateOnly(dateCell);

                    const finalAgent = normaliserAgent(rawAgent, binomeLookup);

                    const matchDate = (dateOnly === targetDateStr);
                    const matchAgent = (selectedAgent === "ALL" || finalAgent === selectedAgent);

                    if (matchDate && matchAgent && refVal !== "") {
                        if (!firstDateMap[refVal] || firstDateMap[refVal].dateStr !== targetDateStr) return;

                        if (!refMap[refVal]) {
                            refMap[refVal] = {
                                agents: new Set(),
                                famille: rawFamille
                            };
                        }
                        refMap[refVal].agents.add(finalAgent);
                        if (!refMap[refVal].famille && rawFamille) {
                            refMap[refVal].famille = rawFamille;
                        }
                    }
                }
            });
            const uniqueRefsList = Object.keys(refMap);
            const totalCount = uniqueRefsList.length;

            let countTissu = 0;
            let countAccessoire = 0;

            uniqueRefsList.forEach(ref => {
                const fam = refMap[ref].famille;
                if (fam === "TISSU") {
                    countTissu++;
                } else if (fam === "ACCESSOIRE") {
                    countAccessoire++;
                }
            });

            countEl.textContent = totalCount;
            tissuEl.textContent = countTissu;
            accessoireEl.textContent = countAccessoire;
            mettreAJourAiguille(totalCount);
            calculerTotalSemaine(selectedIsoDate, selectedAgent, firstDateMap);

            const agentText = selectedAgent === "ALL" ? "" : ` (${selectedAgent})`;
            const pageLabel = currentPage === 2 ? " [DATE RÉEL]" : "";
            labelEl.textContent = `RÉF. INVENTORIÉE du ${targetDateStr}${agentText}${pageLabel}`;

            currentFilteredList = uniqueRefsList.map((ref, idx) => ({
                "N°": idx + 1,
                "Date Saisie": targetDateStr,
                "Référence": ref,
                "Famille": refMap[ref].famille || "-",
                "Agent": Array.from(refMap[ref].agents).join(", ")
            }));

            tbody.innerHTML = "";

            if (totalCount > 0) {
                const groupesWeb = {};
                uniqueRefsList.forEach(ref => {
                    const agentLabel = Array.from(refMap[ref].agents).join(", ");
                    if (!groupesWeb[agentLabel]) {
                        groupesWeb[agentLabel] = [];
                    }
                    groupesWeb[agentLabel].push({
                        ref: ref,
                        famille: refMap[ref].famille || "-"
                    });
                });

                Object.keys(groupesWeb).sort().forEach(agentGroupe => {
                    const liste = groupesWeb[agentGroupe];

                    const trHeader = document.createElement("tr");
                    trHeader.innerHTML = `
                        <td colspan="4" style="background-color: #1f4e78; color: #ffffff; font-weight: bold; padding: 8px 12px;">
                            AGENT : ${agentGroupe}
                        </td>
                    `;
                    tbody.appendChild(trHeader);

                    liste.forEach((item, idx) => {
                        const tr = document.createElement("tr");
                        tr.innerHTML = `
                            <td>${idx + 1}</td>
                            <td><strong>${item.ref}</strong></td>
                            <td>${item.famille}</td>
                            <td><span class="agent-badge">${agentGroupe}</span></td>
                        `;
                        tbody.appendChild(tr);
                    });

                    const trTotal = document.createElement("tr");
                    trTotal.innerHTML = `
                        <td colspan="3" style="background-color: #e9edf4; color: #1f4e78; font-weight: bold; text-align: right; padding: 8px 12px;">
                            TOTAL RÉFÉRENCES (${agentGroupe}) :
                        </td>
                        <td style="background-color: #e9edf4; color: #1f4e78; font-weight: bold; padding: 8px 12px;">
                            ${liste.length}
                        </td>
                    `;
                    tbody.appendChild(trTotal);
                });

                tableContainer.style.display = isDetailsVisible ? "block" : "none";
                btnDetails.textContent = isDetailsVisible ? "MOINS" : "DETAILS";
            } else {
                isDetailsVisible = false;
                tableContainer.style.display = "none";
                btnDetails.textContent = "DETAILS";
            }
        }

        function exporterExcel() {
            if (currentFilteredList.length === 0) {
                alert("Tsy misy angona haondrana ho Excel amin'io daty na Agent io.");
                return;
            }

            const selectedIsoDate = document.getElementById("dateFilter").value;
            const targetDateStr = formatInputDateToSheetFormat(selectedIsoDate);
            const selectedAgent = document.getElementById("agentFilter").value;
            const agentSuffix = selectedAgent === "ALL" ? "Tous" : selectedAgent.replace(/\s+/g, "_").replace(/\//g, "-");
            const pageSuffix = currentPage === 2 ? "_DateReel" : "";
            const dateColHeader = currentPage === 1 ? "Date Saisie" : "Date Réel";
            const totalSemaineExcel = parseInt(document.getElementById("semaineCount").textContent, 10) || 0;

            const binomeLookup = construireMappingBinomes(targetDateStr);
            const firstDateMap = construireFirstDateParRef();
            const localElementsCount = {};
            const individualElementsCount = {};

            allRowsData.forEach(row => {
                if (!estLigneValidePourPage(row)) return;

                const refCell = row.c.at(0);
                const agentCell = row.c.at(1);
                const dateCell = getActiveDateCell(row);
                const elementCell = row.c.at(4);

                if (refCell && refCell.v && dateCell) {
                    const refVal = String(refCell.v).trim().toUpperCase();
                    const rawAgent = (agentCell && agentCell.v) ? String(agentCell.v).trim() : "Tsy voalaza";
                    const rawElement = (elementCell && elementCell.v) ? String(elementCell.v).trim() : "";
                    const dateOnly = extractDateOnly(dateCell);

                    const finalAgent = normaliserAgent(rawAgent, binomeLookup);
                    const matchDate = (dateOnly === targetDateStr);
                    const matchAgent = (selectedAgent === "ALL" || finalAgent === selectedAgent);

                    if (matchDate && matchAgent && refVal !== "") {
                        if (!firstDateMap[refVal] || firstDateMap[refVal].dateStr !== targetDateStr) return;

                        if (!localElementsCount[finalAgent]) localElementsCount[finalAgent] = 0;
                        if (rawElement !== "") localElementsCount[finalAgent] += 1;

                        const nomsIndiv = finalAgent.split(/[\/,]/).map(n => n.trim()).filter(n => n !== "");
                        nomsIndiv.forEach(nom => {
                            const cle = nom.toUpperCase();
                            if (!individualElementsCount[cle]) individualElementsCount[cle] = 0;
                            if (rawElement !== "") individualElementsCount[cle] += 1;
                        });
                    }
                }
            });

            const groupesParAgent = {};
            const agentsIndividuelsMap = {};

            currentFilteredList.forEach(item => {
                const agentGroupe = item["Agent"] || "Tsy voalaza";
                if (!groupesParAgent[agentGroupe]) {
                    groupesParAgent[agentGroupe] = [];
                }
                groupesParAgent[agentGroupe].push({
                    date: item["Date Saisie"],
                    ref: item["Référence"],
                    famille: item["Famille"]
                });

                const nomsSepares = agentGroupe.split(/[\/,]/).map(n => n.trim()).filter(n => n !== "");
                const dejaComptePourCetteRef = new Set();

                nomsSepares.forEach(nom => {
                    const cle = nom.toUpperCase();
                    if (!dejaComptePourCetteRef.has(cle)) {
                        dejaComptePourCetteRef.add(cle);
                        if (!agentsIndividuelsMap[cle]) {
                            agentsIndividuelsMap[cle] = { nomAffiche: nom, total: 0 };
                        }
                        agentsIndividuelsMap[cle].total += 1;
                    }
                });
            });
            const agentsTries = Object.keys(groupesParAgent).sort();
            const agentsIndividuelsTries = Object.values(agentsIndividuelsMap).sort((a, b) =>
                a.nomAffiche.localeCompare(b.nomAffiche, 'fr', { sensitivity: 'base' })
            );

            const totalGeneral = currentFilteredList.length;
            let minCount = Infinity;
            let minElem = Infinity;
            let minAgents = [];

            let maxCount = -Infinity;
            let maxElem = -Infinity;
            let maxAgents = [];

            agentsTries.forEach(agent => {
                const refCount = groupesParAgent[agent].length;
                const elemCount = localElementsCount[agent] || 0;

                if (refCount < minCount || (refCount === minCount && elemCount < minElem)) {
                    minCount = refCount;
                    minElem = elemCount;
                    minAgents = [agent];
                } else if (refCount === minCount && elemCount === minElem) {
                    minAgents.push(agent);
                }

                if (refCount > maxCount || (refCount === maxCount && elemCount > maxElem)) {
                    maxCount = refCount;
                    maxElem = elemCount;
                    maxAgents = [agent];
                } else if (refCount === maxCount && elemCount === maxElem) {
                    maxAgents.push(agent);
                }
            });

            const minAgentText = `${minAgents.join(", ")} (${minElem} élém.)`;
            const maxAgentText = `${maxAgents.join(", ")} (${maxElem} élém.)`;

            let faibleCount = Infinity;
            let faibleElem = Infinity;
            let faibleAgents = [];

            let fortCount = -Infinity;
            let fortElem = -Infinity;
            let fortAgents = [];

            agentsIndividuelsTries.forEach(agObj => {
                const refCount = agObj.total;
                const elemCount = individualElementsCount[agObj.nomAffiche.toUpperCase()] || 0;

                if (refCount < faibleCount || (refCount === faibleCount && elemCount < faibleElem)) {
                    faibleCount = refCount;
                    faibleElem = elemCount;
                    faibleAgents = [agObj.nomAffiche];
                } else if (refCount === faibleCount && elemCount === faibleElem) {
                    faibleAgents.push(agObj.nomAffiche);
                }

                if (refCount > fortCount || (refCount === fortCount && elemCount > fortElem)) {
                    fortCount = refCount;
                    fortElem = elemCount;
                    fortAgents = [agObj.nomAffiche];
                } else if (refCount === fortCount && elemCount === fortElem) {
                    fortAgents.push(agObj.nomAffiche);
                }
            });

            const faibleAgentText = `${faibleAgents.join(", ")} (${faibleElem} élém.)`;
            const fortAgentText = `${fortAgents.join(", ")} (${fortElem} élém.)`;
            const leftRows = [];
            agentsTries.forEach(agent => {
                const liste = groupesParAgent[agent];
                leftRows.push({ type: "agent-header", text: `AGENT : ${agent}` });
                leftRows.push({ type: "col-header" });
                liste.forEach((row, idx) => {
                    leftRows.push({ type: "data", index: idx + 1, ...row, odd: idx % 2 !== 0 });
                });
                leftRows.push({ type: "total", agent: agent, count: liste.length });
                leftRows.push({ type: "spacer" });
            });
            const totalGridRows = Math.max(leftRows.length, agentsIndividuelsTries.length + 4);
            const finalGridRows = Math.max(totalGridRows, 13);
            const bdr = "border: 1px solid #94a3b8;";

            let tableHtml = '<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns="http://w3.org">';
            tableHtml += '<head><meta charset="UTF-8"><\/head><body>';
            tableHtml += '<table style="border-collapse: collapse; font-family: Calibri, Arial, sans-serif; font-size: 11pt;">';
            tableHtml += '<colgroup><col width="45"><col width="105"><col width="175"><col width="125"><col width="25"><col width="25"><col width="25"><col width="185"><col width="55"><col width="190"><col width="190"><\/colgroup><tbody>';

            tableHtml += '<tr style="height: 36px;"><td colspan="4" style="font-size: 22pt; font-weight: bold; color: #1f4e78; text-align: center; vertical-align: middle; padding: 4px 8px;">DETAILS<\/td><td><\/td><td><\/td><td><\/td><td colspan="4" style="font-size: 22pt; font-weight: bold; color: #1f4e78; text-align: center; vertical-align: middle; padding: 4px 8px;">EVALUATION AGENT<\/td><\/tr>';
            tableHtml += '<tr style="height: 14px;"><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr>';

            const cellPad = "padding: 3px 8px; vertical-align: middle;";

            for (let r = 0; r < finalGridRows; r++) {
                const rowHeight = (r === 7 || r === 11) ? "42px" : "24px";
                tableHtml += `<tr style="height: ${rowHeight};">`;

                const leftItem = leftRows[r];
                if (!leftItem || leftItem.type === "spacer") {
                    tableHtml += `<td colspan="4" style="${cellPad}"><\/td>`;
                } else if (leftItem.type === "agent-header") {
                    tableHtml += `<td colspan="4" style="background-color: #1f4e78; color: #ffffff; font-weight: bold; text-align: left; ${cellPad} ${bdr}">${leftItem.text}<\/td>`;
                } else if (leftItem.type === "col-header") {
                    tableHtml += `<td style="background-color: #d9e1f2; color: #1f4e78; font-weight: bold; text-align: center; ${cellPad} ${bdr}">N°<\/td>`;
                    tableHtml += `<td style="background-color: #d9e1f2; color: #1f4e78; font-weight: bold; text-align: center; ${cellPad} ${bdr}">${dateColHeader}<\/td>`;
                    tableHtml += `<td style="background-color: #d9e1f2; color: #1f4e78; font-weight: bold; text-align: center; ${cellPad} ${bdr}">Référence<\/td>`;
                    tableHtml += `<td style="background-color: #d9e1f2; color: #1f4e78; font-weight: bold; text-align: center; ${cellPad} ${bdr}">Famille<\/td>`;
                } else if (leftItem.type === "data") {
                    const bg = leftItem.odd ? "#f8fafc" : "#ffffff";
                    tableHtml += `<td style="background-color: ${bg}; text-align: center; ${cellPad} ${bdr}">${leftItem.index}<\/td>`;
                    tableHtml += `<td style="background-color: ${bg}; text-align: center; ${cellPad} ${bdr}">${leftItem.date}<\/td>`;
                    tableHtml += `<td style="background-color: ${bg}; font-weight: bold; ${cellPad} ${bdr}">${leftItem.ref}<\/td>`;
                    tableHtml += `<td style="background-color: ${bg}; ${cellPad} ${bdr}">${leftItem.famille}<\/td>`;
                } else if (leftItem.type === "total") {
                    tableHtml += `<td colspan="3" style="background-color: #e9edf4; color: #1f4e78; font-weight: bold; text-align: right; ${cellPad} ${bdr}">TOTAL RÉFÉRENCES (${leftItem.agent}) :<\/td>`;
                    tableHtml += `<td style="background-color: #e9edf4; color: #1f4e78; font-weight: bold; text-align: center; ${cellPad} ${bdr}">${leftItem.count}<\/td>`;
                }

                tableHtml += '<td colspan="3"><\/td>';

                if (r === 0) {
                    tableHtml += `<td colspan="2" style="background-color: #1e293b; color: #ffffff; font-weight: bold; text-align: center; ${cellPad} ${bdr}">AGENTS ACTIFS (${agentsIndividuelsTries.length})<\/td>`;

                } else if (r === 11) {
