        const MAX_SPEEDO = 200;

        let currentPage = 1;
        let allRowsData = [];
        let currentFilteredList = [];
        let isDetailsVisible = false;
        let selectedAgentsSet = new Set(["ALL"]);

        function toggleAgentDropdown(event) {
            event.stopPropagation();
            const container = document.getElementById("agentMultiselect");
            if (container) {
                container.classList.toggle("open");
            }
        }

        document.addEventListener("click", function (event) {
            const container = document.getElementById("agentMultiselect");
            if (container && !container.contains(event.target)) {
                container.classList.remove("open");
            }
        });

        function changerPage(pageNum) {
            if (currentPage === pageNum) return;
            currentPage = pageNum;

            document.getElementById("tabPage1").classList.toggle("active", pageNum === 1);
            document.getElementById("tabPage2").classList.toggle("active", pageNum === 2);

            const titleEl = document.getElementById("mainTitle");
            if (titleEl) {
                titleEl.textContent = pageNum === 1 ? "SUIVI INVENTAIRE PAR DATE DE SAISIE" : "SUIVI INVENTAIRE PAR DATE RÉEL (DATE EO @FICHE)";
            }

            isDetailsVisible = false;
            const tableContainer = document.getElementById("tableContainer");
            const logoPlaceholder = document.getElementById("logoPlaceholder");
            const btnDetails = document.getElementById("btnToggleDetails");
            if (tableContainer) tableContainer.style.display = "none";
            if (logoPlaceholder) logoPlaceholder.style.display = "flex";
            if (btnDetails) btnDetails.textContent = "DETAILS";

            selectedAgentsSet = new Set(["ALL"]);
            mettreAJourListeAgents();
            appliquerFiltres();
        }

        function estLigneValidePourPage(row) {
            const agentCell = row.c.at(1);
            const typeColBCell = row.c.at(6);

            const rawAgent = (agentCell && agentCell.v) ? String(agentCell.v).trim().toUpperCase() : "";
            const typeColB = (typeColBCell && typeColBCell.v) ? String(typeColBCell.v).trim().toUpperCase() : "";

            if (rawAgent === "ORLI" || typeColB === "ORLI") return false;
            if (typeColB !== "INV") return false;

            return true;
        }

        function getActiveDateCell(row) {
            return currentPage === 1 ? row.c.at(2) : row.c.at(5);
        }

        function dessinerGraduationsCompteur() {
            const ticksGroup = document.getElementById("speedoTicks");
            if (!ticksGroup) return;

            const cx = 170;
            const cy = 165;
            const rOuter = 124;
            const rInnerMajor = 110;
            const rInnerMinor = 117;
            const rText = 95;

            let svgHtml = "";

            for (let val = 0; val <= MAX_SPEEDO; val += 10) {
                const isMajor = (val % 20 === 0);
                const angleDeg = -120 + (val / MAX_SPEEDO) * 240;
                const angleRad = (angleDeg - 90) * (Math.PI / 180);

                const x1 = cx + rOuter * Math.cos(angleRad);
                const y1 = cy + rOuter * Math.sin(angleRad);
                const rIn = isMajor ? rInnerMajor : rInnerMinor;
                const x2 = cx + rIn * Math.cos(angleRad);
                const y2 = cy + rIn * Math.sin(angleRad);

                let strokeColor = isMajor ? "#ffffff" : "#9aa0a6";
                if (val <= 40) strokeColor = "#ff5252";
                else if (val >= 160) strokeColor = "#00e676";

                const strokeWidth = isMajor ? "2.6" : "1.4";
                svgHtml += `<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="${strokeColor}" stroke-width="${strokeWidth}" stroke-linecap="round" />`;

                if (isMajor) {
                    const tx = cx + rText * Math.cos(angleRad);
                    const ty = cy + rText * Math.sin(angleRad) + 4;

                    let textColor = "#e8eaed";
                    if (val <= 40) textColor = "#ff5252";
                    else if (val >= 160) textColor = "#00e676";

                    svgHtml += `<text x="${tx.toFixed(1)}" y="${ty.toFixed(1)}" text-anchor="middle" fill="${textColor}" font-size="11.5" font-weight="bold">${val}</text>`;
                }
            }

            ticksGroup.innerHTML = svgHtml;
        }
        function mettreAJourAiguille(count) {
            const needle = document.getElementById("needleGroup");
            if (!needle) return;

            const clampedValue = Math.min(Math.max(count, 0), MAX_SPEEDO);
            const angle = -120 + (clampedValue / MAX_SPEEDO) * 240;
            needle.style.transform = `rotate(${angle}deg)`;
        }

        function initDateInput() {
            const now = new Date();
            const yyyy = now.getFullYear();

        function formatInputDateToSheetFormat(isoDate) {
            if (!isoDate) return "";
            const parts = isoDate.split("-");
            if (parts.length !== 3) return "";
            return parts.at(2) + "/" + parts.at(1) + "/" + parts.at(0);
        }

        function extractDateOnly(dateCell) {
            if (!dateCell) return "";
            const rawDateStr = dateCell.f ? String(dateCell.f) : String(dateCell.v);
            if (!rawDateStr) return "";

            if (rawDateStr.startsWith("Date(")) {
                const parts = rawDateStr.replace("Date(", "").replace(")", "").split(",");
                const annee = parts.at(0);
                const mois = String(parseInt(parts.at(1)) + 1).padStart(2, '0');
                const jour = String(parts.at(2)).padStart(2, '0');
                return `${jour}/${mois}/${annee}`;
            }

            return rawDateStr.trim().substring(0, 10);
        }

        function getBornesSemaine(isoDate) {
            if (!isoDate) return null;
            const parts = isoDate.split("-");
            if (parts.length !== 3) return null;

            const d = new Date(parseInt(parts.at(0), 10), parseInt(parts.at(1), 10) - 1, parseInt(parts.at(2), 10));
            const day = d.getDay();
            const diffToMonday = (day === 0) ? -6 : (1 - day);

            const lundi = new Date(d);
            lundi.setDate(d.getDate() + diffToMonday);
            lundi.setHours(0, 0, 0, 0);

            const dimanche = new Date(lundi);
            dimanche.setDate(lundi.getDate() + 6);
            dimanche.setHours(23, 59, 59, 999);

            return { lundi, dimanche };
        }

        function parseSheetDateToObj(dateStr) {
            if (!dateStr) return null;
            const parts = dateStr.split("/");
            if (parts.length !== 3) return null;
            const dd = parseInt(parts.at(0), 10);
            const mm = parseInt(parts.at(1), 10) - 1;
            const yyyy = parseInt(parts.at(2), 10);
            if (isNaN(dd) || isNaN(mm) || isNaN(yyyy)) return null;
            return new Date(yyyy, mm, dd, 12, 0, 0);
        }
        function construireFirstDateParRef() {
            const firstDateMap = {};
            allRowsData.forEach(row => {
                if (!estLigneValidePourPage(row)) return;

                const refCell = row.c.at(0);
                const dateCell = getActiveDateCell(row);

                if (refCell && refCell.v && dateCell) {
                    const refVal = String(refCell.v).trim().toUpperCase();
                    const dateOnly = extractDateOnly(dateCell);
                    const dateObj = parseSheetDateToObj(dateOnly);

                    if (refVal !== "" && dateObj) {
                        if (!firstDateMap[refVal] || dateObj.getTime() < firstDateMap[refVal].time) {
                            firstDateMap[refVal] = {
                                dateStr: dateOnly,
                                time: dateObj.getTime()
                            };
                        }
                    }
                }
            });
            return firstDateMap;
        }

        function canonicaliserBinome(rawAgent) {
            const clean = rawAgent.trim();
            if (!clean) return "Tsy voalaza";
            if (!clean.includes("/")) return clean;

            const membres = clean.split("/")
                .map(m => m.trim())
                .filter(m => m !== "");

            membres.sort((a, b) => a.localeCompare(b, 'fr', { sensitivity: 'base' }));
            return membres.join("/");
        }

        function construireMappingBinomesSemaine(bornes) {
            const binomeLookup = {};
            allRowsData.forEach(row => {
                if (!estLigneValidePourPage(row)) return;

                const refCell = row.c.at(0);
                const agentCell = row.c.at(1);
                const dateCell = getActiveDateCell(row);

                if (refCell && refCell.v && dateCell) {
                    const dateOnlyStr = extractDateOnly(dateCell);
                    const dateObj = parseSheetDateToObj(dateOnlyStr);
                    if (dateObj && dateObj >= bornes.lundi && dateObj <= bornes.dimanche) {
                        const rawAgent = (agentCell && agentCell.v) ? String(agentCell.v).trim() : "";
                        if (rawAgent !== "" && rawAgent.includes("/")) {
                            const canonique = canonicaliserBinome(rawAgent);
                            const membres = canonique.split("/");
                            membres.forEach(membre => {
                                const key = membre.toUpperCase();
                                if (!binomeLookup[key]) {
                                    binomeLookup[key] = canonique;
                                }
                            });
                        }
                    }
                }
            });
            return binomeLookup;
        }

        function construireMappingBinomes(targetDateStr) {
            const binomeLookup = {};
            allRowsData.forEach(row => {
                if (!estLigneValidePourPage(row)) return;

                const refCell = row.c.at(0);
                const agentCell = row.c.at(1);
                const dateCell = getActiveDateCell(row);

                if (refCell && refCell.v && dateCell) {
                    const dateOnly = extractDateOnly(dateCell);
                    if (dateOnly === targetDateStr) {
                        const rawAgent = (agentCell && agentCell.v) ? String(agentCell.v).trim() : "";
                        if (rawAgent !== "" && rawAgent.includes("/")) {
                            const canonique = canonicaliserBinome(rawAgent);
                            const membres = canonique.split("/");
                            membres.forEach(membre => {
                                const key = membre.toUpperCase();
                                if (!binomeLookup[key]) {
                                    binomeLookup[key] = canonique;
                                }
                            });
                        }
                    }
                }
            });
            return binomeLookup;
        }

        function normaliserAgent(rawAgent, binomeLookup) {
            const clean = rawAgent.trim();
            if (!clean) return "Tsy voalaza";
            if (clean.includes("/")) return canonicaliserBinome(clean);
            const key = clean.toUpperCase();
            return binomeLookup[key] ? binomeLookup[key] : clean;
        }

                if (refCell && refCell.v && dateCell) {
                    const refVal = String(refCell.v).trim().toUpperCase();
                    const dateOnlyStr = extractDateOnly(dateCell);
                    const dateObj = parseSheetDateToObj(dateOnlyStr);

                    if (dateObj && dateObj >= bornes.lundi && dateObj <= bornes.dimanche && refVal !== "") {
                        if (!firstDateMap[refVal] || firstDateMap[refVal].dateStr !== dateOnlyStr) return;

                        const rawAgent = (agentCell && agentCell.v) ? String(agentCell.v).trim() : "Tsy voalaza";

                    agentsIndividuelsMap[cle] = { nomAffiche: nom, total: 0 };
                }
                agentsIndividuelsMap[cle].total += 1;
            }
        });
    });

    const agentsTries = Object.keys(groupesParAgent).sort();

    // ORDRE CROISSANT (ISA KELY MANKANY AMIN'NY LEHIBE)
    const agentsIndividuelsTries = Object.values(agentsIndividuelsMap).sort((a, b) => {
        if (a.total !== b.total) {

        return a.nomAffiche.localeCompare(b.nomAffiche, 'fr', { sensitivity: 'base' });
    });

    const totalGeneral = currentFilteredList.length;
    let minCount = Infinity, minElem = Infinity, minAgents = [];

            minAgents.push(agent);
        }
        if (refCount > maxCount || (refCount === maxCount && elemCount > maxElem)) {
            maxCount = refCount; maxElem = elemCount; maxAgents = [agent];
        } else if (refCount === maxCount && elemCount === maxElem) {
            maxAgents.push(agent);
        }
    });

    const minAgentText = `${minAgents.join(", ")} (${minElem} élém.)`;
    const maxAgentText = `${maxAgents.join(", ")} (${maxElem} élém.)`;

    let faibleCount = Infinity, faibleElem = Infinity, faibleAgents = [];
    let fortCount = -Infinity, fortElem = -Infinity, fortAgents = [];

    agentsIndividuelsTries.forEach(agObj => {
        const refCount = agObj.total;
        const elemCount = individualElementsCount[agObj.nomAffiche.toUpperCase()] || 0;
        if (refCount < faibleCount || (refCount === faibleCount && elemCount < faibleElem)) {
            faibleCount = refCount; faibleElem = elemCount; faibleAgents = [agObj.nomAffiche];
        } else if (refCount === faibleCount && elemCount === faibleElem) {
            faibleAgents.push(agObj.nomAffiche);
        }
        if (refCount > fortCount || (refCount === fortCount && elemCount > fortElem)) {
            fortCount = refCount; fortElem = elemCount; fortAgents = [agObj.nomAffiche];
        } else if (refCount === fortCount && elemCount === fortElem) {
            fortAgents.push(agObj.nomAffiche);
        }
    });

    const faibleAgentText = `${faibleAgents.join(", ")} (${faibleElem} élém.)`;
    const fortAgentText = `${fortAgents.join(", ")} (${fortElem} élém.)`;
    const leftRows = [];
    agentsTries.forEach(agent => {
        const liste = groupesParAgent[agent];
        leftRows.push({ type: "agent-header", text: `AGENT : ${agent}` });
        leftRows.push({ type: "col-header" });
        liste.forEach((row, idx) => {
            leftRows.push({ type: "data", index: idx + 1, ...row, odd: idx % 2 !== 0 });
        });
        leftRows.push({ type: "total", agent: agent, count: liste.length });
        leftRows.push({ type: "spacer" });
    });

    const totalGridRows = Math.max(leftRows.length, agentsIndividuelsTries.length + 4);
    const finalGridRows = Math.max(totalGridRows, 13);
    const bdr = "border: 1px solid #94a3b8;";
    const cellPad = "padding: 3px 8px; vertical-align: middle;";

    let tableHtml = '<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns="http://w3.org">';
    tableHtml += '<head><meta charset="UTF-8"><\/head><body>';
    tableHtml += '<table style="border-collapse: collapse; font-family: Calibri, Arial, sans-serif; font-size: 11pt;">';
    tableHtml += '<colgroup><col width="45"><col width="105"><col width="175"><col width="125"><col width="25"><col width="25"><col width="25"><col width="185"><col width="55"><col width="190"><col width="190"><\/colgroup><tbody>';
    tableHtml += '<tr style="height: 36px;"><td colspan="4" style="font-size: 22pt; font-weight: bold; color: #1f4e78; text-align: center; vertical-align: middle; padding: 4px 8px;">DETAILS<\/td><td><\/td><td><\/td><td><\/td><td colspan="4" style="font-size: 22pt; font-weight: bold; color: #1f4e78; text-align: center; vertical-align: middle; padding: 4px 8px;">EVALUATION AGENT<\/td><\/tr>';
    tableHtml += '<tr style="height: 14px;"><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr>';

    for (let r = 0; r < finalGridRows; r++) {
        const rowHeight = (r === 7 || r === 11) ? "42px" : "24px";
        tableHtml += `<tr style="height: ${rowHeight};">`;

        const leftItem = leftRows[r];
        if (!leftItem || leftItem.type === "spacer") {
            tableHtml += `<td colspan="4" style="${cellPad}"><\/td>`;
        } else if (leftItem.type === "agent-header") {
            tableHtml += `<td colspan="4" style="background-color: #1f4e78; color: #ffffff; font-weight: bold; text-align: left; ${cellPad} ${bdr}">${leftItem.text}<\/td>`;
        } else if (leftItem.type === "col-header") {
            tableHtml += `<td style="background-color: #d9e1f2; color: #1f4e78; font-weight: bold; text-align: center; ${cellPad} ${bdr}">N°<\/td><td style="background-color: #d9e1f2; color: #1f4e78; font-weight: bold; text-align: center; ${cellPad} ${bdr}">${dateColHeader}<\/td><td style="background-color: #d9e1f2; color: #1f4e78; font-weight: bold; text-align: center; ${cellPad} ${bdr}">Référence<\/td><td style="background-color: #d9e1f2; color: #1f4e78; font-weight: bold; text-align: center; ${cellPad} ${bdr}">Famille<\/td>`;
        } else if (leftItem.type === "data") {
            const bg = leftItem.odd ? "#f8fafc" : "#ffffff";
            tableHtml += `<td style="background-color: ${bg}; text-align: center; ${cellPad} ${bdr}">${leftItem.index}<\/td><td style="background-color: ${bg}; text-align: center; ${cellPad} ${bdr}">${leftItem.date}<\/td><td style="background-color: ${bg}; font-weight: bold; ${cellPad} ${bdr}">${leftItem.ref}<\/td><td style="background-color: ${bg}; ${cellPad} ${bdr}">${leftItem.famille}<\/td>`;
        } else if (leftItem.type === "total") {
            tableHtml += `<td colspan="3" style="background-color: #e9edf4; color: #1f4e78; font-weight: bold; text-align: right; ${cellPad} ${bdr}">TOTAL RÉFÉRENCES (${leftItem.agent}) :<\/td><td style="background-color: #e9edf4; color: #1f4e78; font-weight: bold; text-align: center; ${cellPad} ${bdr}">${leftItem.count}<\/td>`;
        }

        tableHtml += '<td colspan="3"><\/td>';

        if (r === 0) {
            tableHtml += `<td colspan="2" style="background-color: #1e293b; color: #ffffff; font-weight: bold; text-align: center; ${cellPad} ${bdr}">AGENTS ACTIFS (${agentsIndividuelsTries.length})<\/td>`;
        } else if (r <= agentsIndividuelsTries.length) {
            const agObj = agentsIndividuelsTries[r - 1];
            const rowBg = (r % 2 === 0) ? "#f8fafc" : "#ffffff";
            tableHtml += `<td style="background-color: ${rowBg}; color: #0f172a; ${cellPad} ${bdr}">${agObj.nomAffiche}<\/td><td style="background-color: ${rowBg}; color: #0f172a; font-weight: bold; text-align: center; ${cellPad} ${bdr}">${agObj.total}<\/td>`;
        } else {
            tableHtml += '<td colspan="2"><\/td>';
        }

        if (r === 0) {
            tableHtml += `<td colspan="2" style="background-color: #1d4ed8; color: #ffffff; font-weight: bold; text-align: center; ${cellPad} ${bdr}">TOTAL GÉNÉRAL RÉFÉRENCES<\/td>`;
        } else if (r === 1) {
            tableHtml += `<td colspan="2" style="background-color: #eff6ff; color: #1e3a8a; font-weight: bold; font-size: 14pt; text-align: center; ${cellPad} ${bdr}">${totalGeneral}<\/td>`;
        } else if (r === 2) {
            tableHtml += `<td colspan="2" style="background-color: #0369a1; color: #ffffff; font-weight: bold; text-align: center; ${cellPad} ${bdr}">TOTAL SEMAINE RÉFÉRENCES<\/td>`;
        } else if (r === 3) {
            tableHtml += `<td colspan="2" style="background-color: #e0f2fe; color: #0c4a6e; font-weight: bold; font-size: 14pt; text-align: center; ${cellPad} ${bdr}">${totalSemaineExcel}<\/td>`;
        } else if (r === 5) {
            tableHtml += `<td style="background-color: #b91c1c; color: #ffffff; font-weight: bold; text-align: center; ${cellPad} ${bdr}">MIN RÉFÉRENCE<\/td><td style="background-color: #15803d; color: #ffffff; font-weight: bold; text-align: center; ${cellPad} ${bdr}">MAX RÉFÉRENCE<\/td>`;
        } else if (r === 6) {
            tableHtml += `<td style="background-color: #fef2f2; color: #991b1b; font-weight: bold; font-size: 12pt; text-align: center; ${cellPad} ${bdr}">${minCount}<\/td><td style="background-color: #f0fdf4; color: #166534; font-weight: bold; font-size: 12pt; text-align: center; ${cellPad} ${bdr}">${maxCount}<\/td>`;
        } else if (r === 7) {
            tableHtml += `<td style="background-color: #fef2f2; color: #7f1d1d; font-weight: bold; text-align: center; ${cellPad} ${bdr}">${minAgentText}<\/td><td style="background-color: #f0fdf4; color: #14532d; font-weight: bold; text-align: center; ${cellPad} ${bdr}">${maxAgentText}<\/td>`;
        } else if (r === 9) {
            tableHtml += `<td style="background-color: #b91c1c; color: #ffffff; font-weight: bold; text-align: center; ${cellPad} ${bdr}">AGENT FAIBLE<\/td><td style="background-color: #15803d; color: #ffffff; font-weight: bold; text-align: center; ${cellPad} ${bdr}">AGENT FORT<\/td>`;
        } else if (r === 10) {
            tableHtml += `<td style="background-color: #fef2f2; color: #991b1b; font-weight: bold; font-size: 12pt; text-align: center; ${cellPad} ${bdr}">${faibleCount}<\/td><td style="background-color: #f0fdf4; color: #166534; font-weight: bold; font-size: 12pt; text-align: center; ${cellPad} ${bdr}">${fortCount}<\/td>`;
        } else if (r === 11) {
            tableHtml += `<td style="background-color: #fef2f2; color: #7f1d1d; font-weight: bold; text-align: center; ${cellPad} ${bdr}">${faibleAgentText}<\/td><td style="background-color: #f0fdf4; color: #14532d; font-weight: bold; text-align: center; ${cellPad} ${bdr}">${fortAgentText}<\/td>`;
        } else {
            tableHtml += '<td colspan="2"><\/td>';
        }

        tableHtml += '<\/tr>';
    }

    tableHtml += '<\/tbody><\/table><\/body><\/html>';

    const blob = new Blob(["\ufeff", tableHtml], { type: "application/vnd.ms-excel;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `Suivi_Saisie_${selectedIsoDate}_${agentSuffix}${pageSuffix}.xls`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
}

window.addEventListener("DOMContentLoaded", () => {
    dessinerGraduationsCompteur();
    initDateInput();
    chargerDonnees();
    setInterval(chargerDonnees, 15000);
});
</script>
</body>
</html>
